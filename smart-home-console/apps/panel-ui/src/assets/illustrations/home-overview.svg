    <path d="M62 86c0-46 38-84 84-84h506c46 0 84 38 84 84v184H62Z" fill="url(#sofa)"/>
    <rect x="0" y="150" width="802" height="176" rx="48" fill="#78978e"/>
    <rect x="36" y="116" width="223" height="138" rx="35" fill="#9bb1a9"/>
    <rect x="287" y="108" width="225" height="146" rx="35" fill="#8ba59d"/>
    <rect x="542" y="120" width="222" height="134" rx="35" fill="#9bb1a9"/>
    <path d="m599 143 86 6-20 83-86-8Z" fill="#dfc6a3"/>
    <path d="m332 132 90 6-10 84-92-7Z" fill="#d3dfda"/>
    <path d="M72 322v52M720 322v52" stroke="#4e655e" stroke-width="18" stroke-linecap="round"/>
  </g>

  <ellipse cx="868" cy="810" rx="365" ry="90" fill="url(#rug)" opacity=".86"/>
  <g transform="translate(680 660)" filter="url(#shadow)">
    <ellipse cx="210" cy="96" rx="218" ry="72" fill="#a68468"/>
    <ellipse cx="210" cy="82" rx="218" ry="72" fill="#c7a686"/>
    <path d="M66 126 42 246M356 126l26 120" stroke="#765b49" stroke-width="16" stroke-linecap="round"/>
    <rect x="112" y="38" width="88" height="25" rx="12" fill="#e5dccd" transform="rotate(-8 112 38)"/>
    <rect x="176" y="25" width="112" height="28" rx="12" fill="#f2ede5" transform="rotate(4 176 25)"/>
    <ellipse cx="320" cy="56" rx="29" ry="15" fill="#5f7f72"/>
    <path d="M320 55v-42" stroke="#45665a" stroke-width="6"/>
  </g>

  <g transform="translate(1288 448)" filter="url(#shadow)">
    <path d="M112 132c-54-18-83-55-75-107 50 4 82 31 94 85M114 126c10-62 43-98 101-108 9 55-19 99-89 126M112 134c-51 5-88 34-104 85 58 12 105-12 125-70M126 141c58 6 93 36 103 90-61 8-103-22-119-72" fill="#668b78"/>
    <path d="M119 113v143" stroke="#496d5d" stroke-width="12" stroke-linecap="round"/>
    <path d="M60 242h124l-18 150H78Z" fill="#a86f50"/>
    <ellipse cx="122" cy="242" rx="62" ry="22" fill="#c58b69"/>
  </g>

  <g transform="translate(1126 516)" filter="url(#shadow)">
