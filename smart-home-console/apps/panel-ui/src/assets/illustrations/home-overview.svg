    <path d="M64 244V63" stroke="#756253" stroke-width="16" stroke-linecap="round"/>
    <path d="M22 80h84L88 8H40Z" fill="#e5c783"/>
    <ellipse cx="64" cy="83" rx="50" ry="15" fill="#f2dc9f"/>
    <circle cx="64" cy="70" r="72" fill="#ffe7a0" opacity=".2" filter="url(#soft)"/>
  </g>

  <g transform="translate(73 220)" opacity=".72">
    <path d="M0 0h5v230H0zM38 0h5v230h-5zM76 0h5v230h-5z" fill="#789389"/>
    <path d="M-8 45h98M-8 112h98M-8 180h98" stroke="#789389" stroke-width="5"/>
    <rect x="7" y="16" width="29" height="22" rx="4" fill="#c2a47e"/>
    <rect x="45" y="79" width="28" height="27" rx="4" fill="#7794a6"/>
    <rect x="10" y="146" width="62" height="25" rx="4" fill="#d4c0a4"/>
  </g>

  <g fill="#36aefc">
    <circle cx="1054" cy="590" r="7"/>
    <circle cx="1054" cy="590" r="22" opacity=".14"/>
    <circle cx="1414" cy="344" r="7"/>
    <circle cx="1414" cy="344" r="22" opacity=".14"/>
    <circle cx="252" cy="634" r="7"/>
    <circle cx="252" cy="634" r="22" opacity=".14"/>
  </g>
  <rect width="1600" height="900" fill="url(#grain)"/>
</svg>
