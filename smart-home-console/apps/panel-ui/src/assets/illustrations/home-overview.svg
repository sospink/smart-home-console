    <path d="M48 257 178 142l93 70 86-91 143 136" fill="none" stroke="#8aa69a" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="416" cy="92" r="34" fill="#e7c07e"/>
    <path d="M65 277h425" stroke="#a2b8ae" stroke-width="8" stroke-linecap="round"/>
  </g>

