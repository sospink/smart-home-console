<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">温和明亮的智能家居客厅插画</title>
  <desc id="desc">包含落地窗、沙发、灯具、窗帘、绿植和智能设备光点的原创家居空间插画</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f5ef"/>
      <stop offset=".55" stop-color="#eeeae2"/>
      <stop offset="1" stop-color="#e5e9e5"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9eff0"/>
      <stop offset=".58" stop-color="#eef3e8"/>
      <stop offset="1" stop-color="#c7d7cd"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9a58f"/>
      <stop offset="1" stop-color="#d5c6b3"/>
    </linearGradient>
    <linearGradient id="sofa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fa89f"/>
      <stop offset="1" stop-color="#6f8e86"/>
    </linearGradient>
    <linearGradient id="rug" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6d7c4"/>
      <stop offset="1" stop-color="#c9b7a1"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6c8" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff6c8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#31443e" flood-opacity=".15"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <pattern id="grain" width="80" height="80" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="16" r="1" fill="#38554c" opacity=".06"/>
      <circle cx="58" cy="36" r="1.2" fill="#38554c" opacity=".045"/>
      <circle cx="34" cy="68" r=".8" fill="#38554c" opacity=".05"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#wall)"/>
  <circle cx="1245" cy="204" r="300" fill="url(#sun)"/>
  <path d="M0 624h1600v276H0z" fill="url(#floor)"/>
  <path d="M0 624h1600" stroke="#8d7d6d" stroke-opacity=".2" stroke-width="3"/>
  <g opacity=".16" stroke="#7c6956" stroke-width="2">
    <path d="M55 900l420-276M338 900l410-276M624 900l407-276M920 900l402-276M1225 900l375-258"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="932" y="92" width="520" height="464" rx="12" fill="#f9fbf8"/>
    <rect x="958" y="118" width="468" height="412" rx="6" fill="url(#window)"/>
    <path d="M1192 118v412M958 318h468" stroke="#f9fbf8" stroke-width="18"/>
    <path d="M1002 486c96-110 166-138 260-115 68 17 110 7 164-41v200H958v-6c13-10 27-23 44-38Z" fill="#9cb5a5" opacity=".45"/>
    <path d="M960 477c76-68 132-85 205-61 75 25 144 7 261-78v192H958Z" fill="#739184" opacity=".34"/>
    <circle cx="1346" cy="190" r="42" fill="#fff2b7" opacity=".88"/>
  </g>

  <path d="M904 86c-58 92-66 324-12 485l80-22V99Z" fill="#d9cbbc" filter="url(#shadow)"/>
  <path d="M1474 86c48 121 53 326 13 480l-70-22V100Z" fill="#cabaa8" filter="url(#shadow)"/>
  <g opacity=".18" stroke="#765f49" stroke-width="3">
    <path d="M931 108c-28 136-31 294-8 432M1452 108c23 148 27 302 8 426"/>
  </g>

